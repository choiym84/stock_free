spring:
  application:
    name: backend
  docker:
    compose:
      lifecycle-management: start-and-stop
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
server:
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
app:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
    login-throttle:
      max-failures-per-email: ${LOGIN_MAX_FAILURES_PER_EMAIL:5}
      max-failures-per-ip: ${LOGIN_MAX_FAILURES_PER_IP:20}
      window: ${LOGIN_FAILURE_WINDOW:15m}
    require-email-verification: ${REQUIRE_EMAIL_VERIFICATION:true}
    account-tokens:
      email-verification-ttl: ${EMAIL_VERIFICATION_TTL:24h}
      password-reset-ttl: ${PASSWORD_RESET_TTL:30m}
  notification:
    delivery: ${ACCOUNT_NOTIFICATION_DELIVERY:console}
    base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    from: ${MAIL_FROM:no-reply@stockfree.local}
  redis-session:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    ssl: ${REDIS_SSL:false}
