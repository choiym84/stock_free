spring:
  application:
    name: backend
  docker:
    compose:
      lifecycle-management: start-and-stop
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax
app:
  security:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
