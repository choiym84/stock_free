name: stock-free

services:
  postgres:
    image: postgres:17
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: ${POSTGRES_DB:-stock_free}
      POSTGRES_USER: ${POSTGRES_USER:-stock_free}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_free_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  redis:
    image: redis:8-alpine
    profiles: ["redis-session"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
  redis-data:
