name: stock-free

services:
  postgres:
    image: postgres:17
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: ${POSTGRES_DB:-stock_free}
      POSTGRES_USER: ${POSTGRES_USER:-stock_free}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stock_free_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
volumes:
  postgres-data:
